name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m venv .venv && .venv/bin/pip install -e "apps/api[dev]"
      - run: make test
      - run: make eval
      - run: make lint-api
      - run: cd apps/web && npm install && npx tsc --noEmit
