[project]
name = "dossier-api"
version = "0.1.0"
description = "Dossier briefing API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "sqlite-vec>=0.1.6",
  "python-multipart>=0.0.12",
  "pypdf>=5.0",
  "tiktoken>=0.8",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "python-docx>=1.1",
  "pillow>=11.0",
  "rapidocr>=3.9",
  "onnxruntime>=1.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.8",
]
mcp = [
  "mcp>=1.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dossier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]
